info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@example.com",
        "password": "admin"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        const auth_token = response.token;

        if (auth_token) {
          bru.setEnvVar("auth_token", auth_token)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
